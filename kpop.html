<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ELENA의 K-POP 노래방</title>
  <style>
    html, body {height: 100%; margin: 0;}
    body {font-family: 'Inter', 'Malgun Gothic', sans-serif; background: #10101a; display: flex; align-items: center; justify-content: center; overflow: hidden;}
    #app {position: relative; width: min(430px, 100vw); height: 100dvh; background: #16162a; overflow: hidden; display: flex; flex-direction: column; color: #f0f0f5;}
    @media (min-width: 450px) {
      #app {height: min(94dvh, 860px); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);}
    }
    .view {position: absolute; inset: 0; display: flex; flex-direction: column; }
    .view.hidden {display: none;}

    .topbar {display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: rgba(255,255,255,0.04);}
    .topbar .back {background: none; border: none; color: #cfcfe0; font-size: 1.3rem; cursor: pointer; padding: 0; line-height: 1;}
    .topbar h1 {font-size: 1.05rem; margin: 0; font-weight: 700;}
    .topbar .sub {font-size: 0.72rem; color: #9a9ab0; margin: 0;}

    .scroll {flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;}

    /* 그룹 그리드 */
    .grid {display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px;}
    .gcard {border: none; border-radius: 14px; padding: 20px 12px; color: #fff; text-align: left; cursor: pointer; font-family: inherit; min-height: 88px; display: flex; flex-direction: column; justify-content: flex-end;}
    .gcard .ko {font-size: 1.1rem; font-weight: 800;}
    .gcard .en {font-size: 0.72rem; opacity: 0.85;}
    .gcard .cnt {font-size: 0.66rem; opacity: 0.75; margin-top: 2px;}

    /* 곡 목록 */
    .song {display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid rgba(255,255,255,0.06); cursor: pointer;}
    .song:active {background: rgba(255,255,255,0.05);}
    .song .num {width: 22px; text-align: center; color: #7a7a95; font-size: 0.85rem;}
    .song .title {flex: 1; font-size: 0.98rem;}
    .song .go {color: #7a7a95; font-size: 1.1rem;}

    /* 플레이어 */
    #videoWrap {width: 100%; aspect-ratio: 16 / 9; background: #000; position: relative;}
    #ytplayer, #videoWrap iframe {width: 100%; height: 100%; border: 0;}
    #videoFallback {position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; text-align: center; color: #cfcfe0; font-size: 0.85rem;}
    #videoFallback a {color: #7fd7ff;}
    .pbar {display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: rgba(255,255,255,0.04);}
    .pbar .ptitle {flex: 1; min-width: 0;}
    .pbar .ptitle .t {font-size: 0.92rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
    .pbar .ptitle .g {font-size: 0.7rem; color: #9a9ab0;}
    .pbar button {background: rgba(255,255,255,0.08); border: none; color: #f0f0f5; border-radius: 8px; padding: 8px 10px; font-size: 0.8rem; cursor: pointer; font-family: inherit; white-space: nowrap;}
    .pbar button:active {background: rgba(255,255,255,0.16);}
    .pbar button.on {background: #ff2e88; color: #fff;}

    #lyricsPanel {flex: 1; overflow-y: auto; padding: 18px 18px 40vh; text-align: center;}
    .lyric-line {font-size: 1.02rem; line-height: 1.5; color: #6f6f88; padding: 7px 6px; border-radius: 8px; transition: color 0.15s, background 0.15s; cursor: pointer;}
    .lyric-line.active {color: #fff; font-weight: 800; font-size: 1.18rem; background: rgba(255,46,136,0.16);}
    .lyric-line.done {color: #9a9ab0;}
    .lyric-line.next {outline: 2px dashed #ffb000; outline-offset: -2px; color: #ffd98a;}
    .lyric-time {font-size: 0.62rem; color: #ffb000; margin-left: 6px;}
    .lyric-empty {color: #9a9ab0; padding: 30px 10px; line-height: 1.7;}

    /* 싱크 바 */
    #syncBar {display: none; flex-direction: column; gap: 8px; padding: 10px 14px 14px; background: rgba(255,176,0,0.1); border-top: 1px solid rgba(255,176,0,0.3);}
    #syncBar.show {display: flex;}
    #syncBar .info {font-size: 0.75rem; color: #ffd98a; text-align: center;}
    #tapBtn {background: #ffb000; color: #3a2800; border: none; border-radius: 10px; padding: 14px; font-size: 1.05rem; font-weight: 800; cursor: pointer; font-family: inherit;}
    #tapBtn:active {background: #ffc94d;}
    #syncBar .row {display: flex; gap: 8px;}
    #syncBar .row button {flex: 1; background: rgba(255,255,255,0.1); border: none; color: #f0f0f5; border-radius: 8px; padding: 9px; font-size: 0.8rem; cursor: pointer; font-family: inherit;}

    /* 편집 오버레이 */
    .overlay {position: absolute; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; z-index: 20;}
    .overlay.hidden {display: none;}
    .sheet {background: #20203a; border-radius: 14px; padding: 18px; width: 100%; max-width: 360px;}
    .sheet h2 {font-size: 1.05rem; margin: 0 0 4px;}
    .sheet p {font-size: 0.76rem; color: #9a9ab0; margin: 0 0 10px; line-height: 1.5;}
    .sheet textarea {width: 100%; box-sizing: border-box; height: 200px; background: #16162a; border: 1px solid #3a3a5a; border-radius: 10px; color: #f0f0f5; font-size: 0.9rem; padding: 10px; font-family: inherit; resize: vertical;}
    .sheet .btns {display: flex; gap: 8px; margin-top: 12px;}
    .sheet .btns button {flex: 1; border: none; border-radius: 9px; padding: 11px; font-size: 0.95rem; font-weight: 700; cursor: pointer; font-family: inherit;}
    .sheet .save {background: #ff2e88; color: #fff;}
    .sheet .cancel {background: rgba(255,255,255,0.1); color: #f0f0f5;}

    .home {display: block; text-align: center; color: #7a7a95; font-size: 0.78rem; text-decoration: none; padding: 12px;}
    .home:hover {color: #cfcfe0;}
  </style>
</head>
<body>
  <div id="app">
    <!-- 그룹 선택 -->
    <section id="groupsView" class="view">
      <div class="topbar">
        <div>
          <h1>🎤 ELENA의 K-POP 노래방</h1>
          <p class="sub">걸그룹을 골라보세요 · MV 보며 가사 따라부르기</p>
        </div>
      </div>
      <div class="scroll">
        <div class="grid" id="groupGrid"></div>
        <a class="home" href="index.html">← 홈으로</a>
      </div>
    </section>

    <!-- 곡 선택 -->
    <section id="songsView" class="view hidden">
      <div class="topbar">
        <button class="back" id="songsBack">‹</button>
        <div>
          <h1 id="songsTitle">그룹</h1>
          <p class="sub">인기곡을 골라보세요</p>
        </div>
      </div>
      <div class="scroll"><div id="songList"></div></div>
    </section>

    <!-- 플레이어(노래방) -->
    <section id="playerView" class="view hidden">
      <div class="topbar" style="padding:10px 12px;">
        <button class="back" id="playerBack">‹</button>
        <div class="ptitle" style="flex:1;min-width:0;">
          <div class="t" id="pTitle" style="font-size:0.95rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">곡</div>
          <div class="g" id="pGroup" style="font-size:0.7rem;color:#9a9ab0;">그룹</div>
        </div>
      </div>
      <div id="videoWrap">
        <div id="ytplayer"></div>
        <div id="videoFallback">
          <div>이 화면에서는 MV가 임베드되지 않아요.</div>
          <a id="fallbackLink" href="#" target="_blank" rel="noopener">YouTube에서 열기 ↗</a>
        </div>
      </div>
      <div class="pbar">
        <div class="ptitle"><div class="t">가사</div><div class="g" id="lyricHint">노래방처럼 하이라이트</div></div>
        <button id="editBtn">가사 편집</button>
        <button id="syncBtn">탭 싱크</button>
      </div>
      <div id="lyricsPanel"></div>
      <div id="syncBar">
        <div class="info" id="syncInfo">노래를 재생하고, 각 가사 줄이 시작될 때 아래 버튼을 누르세요.</div>
        <button id="tapBtn">♪ 지금 이 줄!</button>
        <div class="row">
          <button id="syncPrev">◀ 이전 줄</button>
          <button id="syncReset">처음부터</button>
          <button id="syncDone">완료</button>
        </div>
      </div>
    </section>

    <!-- 가사 편집 오버레이 -->
    <div class="overlay hidden" id="editorOverlay">
      <div class="sheet">
        <h2>가사 입력</h2>
        <p>가사를 한 줄씩 붙여넣으세요. 저장 후 <b>탭 싱크</b>로 타이밍을 맞추면 노래방처럼 하이라이트돼요. (기기에만 저장됩니다)</p>
        <textarea id="lyricInput" placeholder="여기에 가사를 붙여넣으세요&#10;한 줄에 한 소절"></textarea>
        <div class="btns">
          <button class="cancel" id="editCancel">취소</button>
          <button class="save" id="editSave">저장</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    var GROUPS = [
      {ko:"뉴진스", en:"NewJeans", color:"#5aa9ff", songs:[
        {t:"Supernatural", v:"ZncbtRo7RXs"}, {t:"How Sweet", v:"Q3K0TOvTOno"},
        {t:"OMG", v:"sVTy_wmn5SU"}, {t:"Super Shy", v:"ArmDp-zijuc"},

        {t:"ASAP", v:"dJdqn5v4Dkw"}
      ]},
      {ko:"아이브", en:"IVE", color:"#e84c88", songs:[
        {t:"I AM", v:"-KYXTAszltc"}, {t:"ELEVEN", v:"--FmExEAsM8"},
        {t:"After LIKE", v:"F0B7HDiY-10"}, {t:"REBEL HEART", v:"g36q0ZLvygQ"},
        {t:"BANG BANG", v:"9qkpcLK422o"}, {t:"ATTITUDE", v:"38xYeot-ciM"},
        {t:"XOXZ", v:"B1ShLiq3EVc"}
      ]},
      {ko:"에스파", en:"aespa", color:"#8a5cff", songs:[
        {t:"Supernova", v:"phuiiNCxRMg"}, {t:"Whiplash", v:"jWQx2f-CErU"},
        {t:"Next Level", v:"4TWR90KJl84"}, {t:"Black Mamba", v:"i0_gM5bifeo"},
        {t:"Armageddon", v:"nFYwcndNuOY"}, {t:"Girls", v:"dYRITmpFbJ4"},
        {t:"Better Things", v:"gfk3QLU1x0E"}, {t:"Dirty Work", v:"M2WTUoy4y6E"}
      ]},
      {ko:"르세라핌", en:"LE SSERAFIM", color:"#2f7de1", songs:[
        {t:"CRAZY", v:"n6B5gQXlB-0"}, {t:"EASY", v:"bNKXxwOQYB8"},
        {t:"HOT", v:"r9AEGPB6qIU"}, {t:"Smart", v:"KNexS61fjus"},
        {t:"Come Over", v:"z_uqieM8VGM"}, {t:"CELEBRATION", v:"a2grcJdfXmY"},
        {t:"DIFFERENT", v:"HFZUAXhdnHk"}
      ]},
      {ko:"(여자)아이들", en:"(G)I-DLE", color:"#e0245e", songs:[
        {t:"Queencard", v:"7HDeem-JaSY"}, {t:"Super Lady", v:"6f3RzjXPQwA"},
        {t:"Wife", v:"baaNwRAhHBo"}, {t:"LATATA", v:"p4RIhcY7V3c"},
        {t:"LION", v:"6oanIo_2Z4Q"}, {t:"HANN (Alone)", v:"OKNXn2qCEws"}
      ]},
      {ko:"블랙핑크", en:"BLACKPINK", color:"#ff2e88", songs:[
        {t:"How You Like That", v:"ioNng23DkIM"}, {t:"Pink Venom", v:"gQlMMD8auMs"},
        {t:"Kill This Love", v:"2S24-y0Ij3Y"}, {t:"마지막처럼 (AS IF IT'S YOUR LAST)", v:"Amq-qlqbjYA"},
        {t:"JUMP", v:"CgCVZdcKcqY"}
      ]},
      {ko:"트와이스", en:"TWICE", color:"#ff7fb0", songs:[
        {t:"TT", v:"e8LB3hYOa3c"}, {t:"LIKEY", v:"ERBhY35sulI"},
        {t:"SIGNAL", v:"PBaD9PqHlK4"}, {t:"KNOCK KNOCK", v:"DQxCCVuLFhQ"},
        {t:"Heart Shaker", v:"YBWHtQj0V1g"}, {t:"What is Love?", v:"Lk4WaiK-Ouo"},
        {t:"TURN IT UP", v:"upbHdcFLnhQ"}
      ]},
      {ko:"있지", en:"ITZY", color:"#ff5a3c", songs:[
        {t:"Not Shy", v:"wTowEKjDGkU"}, {t:"Girls Will Be Girls", v:"h6bmy37Rmpg"},
        {t:"GOLD", v:"eMk_0svqsnI"}, {t:"BET ON ME", v:"RmTq3cJqyCo"},
        {t:"Imaginary Friend", v:"NrUlydECU-8"}
      ]},
      {ko:"레드벨벳", en:"Red Velvet", color:"#c0143c", songs:[
        {t:"빨간 맛 (Red Flavor)", v:"WyiIGEHQP8o"}, {t:"Peek-A-Boo", v:"6uJf2IT2Zh8"},
        {t:"Feel My Rhythm", v:"R9At2ICm4LQ"}, {t:"Queendom", v:"c9RzZpV460k"},
        {t:"Chill Kill", v:"xlyrt5eAtKI"}, {t:"Cosmic", v:"FyG21rXCxlY"},
        {t:"Automatic", v:"GRDEETwbxro"}
      ]},
      {ko:"아일릿", en:"ILLIT", color:"#ff8fb3", songs:[
        {t:"Magnetic", v:"Vk5-c_v4gMU"}, {t:"Cherish (My Love)", v:"tbDGl7jEazA"},
        {t:"It's Me", v:"bMhDJ0S0OBA"}, {t:"Sunday Morning", v:"-01oDwXKSuE"},
        {t:"NOT ME", v:"9nEp9eeGaJk"}, {t:"jellyous", v:"GkG60kISnfc"}
      ]},
      {ko:"베이비몬스터", en:"BABYMONSTER", color:"#7d3cff", songs:[
        {t:"PSYCHO", v:"q1hRhHa6LhQ"}, {t:"Ghost", v:"uk6ct8HWLyE"},
        {t:"Really Like You", v:"XShaIZs7J7M"}, {t:"WE GO UP", v:"wlHwjkYpSr0"}
      ]}
    ];
    window.GROUPS = GROUPS;

    // ---------- 뷰 전환 ----------
    var groupsView = document.getElementById('groupsView');
    var songsView = document.getElementById('songsView');
    var playerView = document.getElementById('playerView');
    function showView(v) {
      [groupsView, songsView, playerView].forEach(function(x) { x.classList.add('hidden'); });
      v.classList.remove('hidden');
    }

    // ---------- 그룹 그리드 ----------
    var groupGrid = document.getElementById('groupGrid');
    GROUPS.forEach(function(g, i) {
      var b = document.createElement('button');
      b.className = 'gcard';
      b.style.background = g.color;
      b.innerHTML = '<div class="ko">' + g.ko + '</div><div class="en">' + g.en +
                    '</div><div class="cnt">인기곡 ' + g.songs.length + '곡</div>';
      b.addEventListener('click', function() { openGroup(i); });
      groupGrid.appendChild(b);
    });

    // ---------- 곡 목록 ----------
    var curGroup = 0;
    var songList = document.getElementById('songList');
    function openGroup(i) {
      curGroup = i;
      var g = GROUPS[i];
      document.getElementById('songsTitle').textContent = g.ko + ' · ' + g.en;
      songList.innerHTML = '';
      g.songs.forEach(function(s, j) {
        var row = document.createElement('div');
        row.className = 'song';
        row.innerHTML = '<div class="num">' + (j + 1) + '</div><div class="title">' + s.t +
                        '</div><div class="go">▶</div>';
        row.addEventListener('click', function() { openSong(i, j); });
        songList.appendChild(row);
      });
      songsView.querySelector('.scroll').scrollTop = 0;
      showView(songsView);
    }
    document.getElementById('songsBack').addEventListener('click', function() { showView(groupsView); });

    // ---------- YouTube 플레이어 ----------
    var ytReady = false, ytPlayer = null, pendingVideo = null;
    window.onYouTubeIframeAPIReady = function() {
      ytReady = true;
      if (pendingVideo) loadVideo(pendingVideo);
    };
    (function loadYTApi() {
      var s = document.createElement('script');
      s.src = 'https://www.youtube.com/iframe_api';
      s.onerror = function() { showFallback(); };
      document.head.appendChild(s);
    })();

    function showFallback() {
      document.getElementById('videoFallback').style.display = 'flex';
    }
    function loadVideo(vid) {
      document.getElementById('fallbackLink').href = 'https://www.youtube.com/watch?v=' + vid;
      if (!ytReady || !window.YT || !YT.Player) { pendingVideo = vid; return; }
      pendingVideo = null;
      if (ytPlayer) {
        ytPlayer.loadVideoById(vid);
      } else {
        ytPlayer = new YT.Player('ytplayer', {
          videoId: vid,
          playerVars: {playsinline: 1, rel: 0, modestbranding: 1},
          events: {}
        });
      }
    }
    function curTime() {
      try { return (ytPlayer && ytPlayer.getCurrentTime) ? ytPlayer.getCurrentTime() : 0; }
      catch (e) { return 0; }
    }
    function seekTo(t) {
      try { if (ytPlayer && ytPlayer.seekTo) ytPlayer.seekTo(t, true); } catch (e) {}
    }

    // ---------- 가사 데이터 ----------
    var curSong = null; // {t, v, groupKo}
    var L = {lines: [], times: []};
    function lyricKey(v) { return 'kpop_lyrics_' + v; }
    function loadLyrics(v) {
      try {
        var d = JSON.parse(localStorage.getItem(lyricKey(v)));
        if (d && d.lines) return {lines: d.lines, times: d.times || d.lines.map(function() { return null; })};
      } catch (e) {}
      return {lines: [], times: []};
    }
    function saveLyrics() {
      if (!curSong) return;
      localStorage.setItem(lyricKey(curSong.v), JSON.stringify(L));
    }

    var lyricsPanel = document.getElementById('lyricsPanel');
    var lineEls = [];
    function renderLyrics() {
      lyricsPanel.innerHTML = '';
      lineEls = [];
      if (L.lines.length === 0) {
        var e = document.createElement('div');
        e.className = 'lyric-empty';
        e.innerHTML = '아직 가사가 없어요.<br>위의 <b>가사 편집</b>으로 가사를 붙여넣고,<br><b>탭 싱크</b>로 타이밍을 맞춰보세요!';
        lyricsPanel.appendChild(e);
        return;
      }
      L.lines.forEach(function(text, i) {
        var d = document.createElement('div');
        d.className = 'lyric-line';
        d.dataset.index = i;
        d.textContent = text;
        d.addEventListener('click', function() { onLineClick(i); });
        lyricsPanel.appendChild(d);
        lineEls.push(d);
      });
      refreshSyncTags();
    }

    function fmt(t) {
      var m = Math.floor(t / 60), s = Math.floor(t % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }
    function refreshSyncTags() {
      if (!syncMode) return;
      lineEls.forEach(function(el, i) {
        el.classList.toggle('next', i === syncIdx);
        var old = el.querySelector('.lyric-time');
        if (old) old.remove();
        if (L.times[i] != null) {
          var tag = document.createElement('span');
          tag.className = 'lyric-time';
          tag.textContent = fmt(L.times[i]);
          el.appendChild(tag);
        }
      });
    }

    function currentIndex(t) {
      var idx = -1;
      for (var i = 0; i < L.times.length; i++) {
        if (L.times[i] != null && L.times[i] <= t + 0.02) idx = i;
      }
      return idx;
    }

    var lastActive = -1;
    function updateHighlight(t) {
      if (syncMode || lineEls.length === 0) return;
      var idx = currentIndex(t);
      if (idx === lastActive) return;
      lastActive = idx;
      lineEls.forEach(function(el, i) {
        el.classList.toggle('active', i === idx);
        el.classList.toggle('done', i < idx);
      });
      if (idx >= 0 && lineEls[idx]) {
        lineEls[idx].scrollIntoView({behavior: 'smooth', block: 'center'});
      }
    }

    // ---------- 곡 열기 ----------
    function openSong(gi, si) {
      var g = GROUPS[gi];
      curSong = {t: g.songs[si].t, v: g.songs[si].v, groupKo: g.ko};
      document.getElementById('pTitle').textContent = curSong.t;
      document.getElementById('pGroup').textContent = g.ko + ' · ' + g.en;
      L = loadLyrics(curSong.v);
      lastActive = -1;
      exitSync();
      renderLyrics();
      showView(playerView);
      loadVideo(curSong.v);
    }
    document.getElementById('playerBack').addEventListener('click', function() {
      exitSync();
      showView(songsView);
    });

    // ---------- 가사 편집 ----------
    var editorOverlay = document.getElementById('editorOverlay');
    document.getElementById('editBtn').addEventListener('click', function() {
      document.getElementById('lyricInput').value = L.lines.join('\n');
      editorOverlay.classList.remove('hidden');
    });
    document.getElementById('editCancel').addEventListener('click', function() {
      editorOverlay.classList.add('hidden');
    });
    document.getElementById('editSave').addEventListener('click', function() {
      var raw = document.getElementById('lyricInput').value;
      var lines = raw.split('\n').map(function(s) { return s.trim(); }).filter(function(s) { return s.length > 0; });
      // 기존 타임스탬프는 줄 수/내용이 같을 때만 유지, 아니면 초기화
      var keep = (lines.length === L.lines.length && lines.every(function(x, i) { return x === L.lines[i]; }));
      L.lines = lines;
      L.times = keep ? L.times : lines.map(function() { return null; });
      saveLyrics();
      lastActive = -1;
      renderLyrics();
      editorOverlay.classList.add('hidden');
    });

    // ---------- 탭 싱크 ----------
    var syncMode = false, syncIdx = 0;
    var syncBar = document.getElementById('syncBar');
    var syncBtn = document.getElementById('syncBtn');
    function enterSync() {
      if (L.lines.length === 0) {
        document.getElementById('editBtn').click();
        return;
      }
      syncMode = true;
      syncIdx = 0;
      syncBtn.classList.add('on');
      syncBar.classList.add('show');
      lineEls.forEach(function(el) { el.classList.remove('active', 'done'); });
      refreshSyncTags();
      updateSyncInfo();
    }
    function exitSync() {
      syncMode = false;
      syncBtn.classList.remove('on');
      syncBar.classList.remove('show');
      lineEls.forEach(function(el) { el.classList.remove('next'); });
    }
    syncBtn.addEventListener('click', function() { syncMode ? exitSync() : enterSync(); });
    document.getElementById('syncDone').addEventListener('click', exitSync);

    function updateSyncInfo() {
      var info = document.getElementById('syncInfo');
      if (syncIdx >= L.lines.length) {
        info.textContent = '모든 줄의 타이밍을 저장했어요! [완료]를 누르세요.';
      } else {
        info.textContent = '다음 줄 (' + (syncIdx + 1) + '/' + L.lines.length + '): ' + L.lines[syncIdx];
      }
    }
    function stampLine(i, t) {
      L.times[i] = Math.max(0, t);
      saveLyrics();
    }
    document.getElementById('tapBtn').addEventListener('click', function() {
      if (!syncMode || syncIdx >= L.lines.length) return;
      stampLine(syncIdx, curTime());
      syncIdx++;
      refreshSyncTags();
      updateSyncInfo();
      if (syncIdx < lineEls.length) lineEls[syncIdx].scrollIntoView({behavior: 'smooth', block: 'center'});
    });
    document.getElementById('syncPrev').addEventListener('click', function() {
      if (!syncMode || syncIdx === 0) return;
      syncIdx--;
      L.times[syncIdx] = null;
      saveLyrics();
      refreshSyncTags();
      updateSyncInfo();
    });
    document.getElementById('syncReset').addEventListener('click', function() {
      if (!syncMode) return;
      syncIdx = 0;
      L.times = L.lines.map(function() { return null; });
      saveLyrics();
      refreshSyncTags();
      updateSyncInfo();
    });

    // 가사 줄 클릭: 싱크 모드면 그 줄에 현재시간 찍기, 재생 모드면 그 지점으로 이동
    function onLineClick(i) {
      if (syncMode) {
        stampLine(i, curTime());
        syncIdx = i + 1;
        refreshSyncTags();
        updateSyncInfo();
      } else if (L.times[i] != null) {
        seekTo(L.times[i]);
      }
    }

    // ---------- 하이라이트 루프 ----------
    setInterval(function() {
      if (!playerView.classList.contains('hidden')) updateHighlight(curTime());
    }, 120);

    // 테스트/디버그용 노출
    window.__kpop = {
      get L() { return L; }, updateHighlight: updateHighlight, currentIndex: currentIndex,
      renderLyrics: renderLyrics, enterSync: enterSync, get lineEls() { return lineEls; },
      openSong: openSong, get syncIdx() { return syncIdx; }
    };

    showView(groupsView);
  </script>
</body>
</html>
